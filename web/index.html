<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0F22" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="MediaMax: your movies, shows, music and live TV. Stream without limits." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MediaMax" />
    <meta property="og:title" content="MediaMax" />
    <meta property="og:description" content="Your movies, shows, music and live TV. Stream without limits." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>MediaMax</title>
    <style>
      html, body { background: #0A0F22; margin: 0; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot i { width: 32px; height: 32px; border-radius: 50%; border: 3px solid #ffffff1f; border-top-color: #1FB6F5; animation: s 0.8s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot i { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <!-- No logo here: a white-labelled server shows its own logo once branding has loaded (App.tsx Splash). -->
    <div id="root"><div id="boot"><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
