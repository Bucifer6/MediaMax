# MediaMax on QNAP QTS / QuTS hero with Container Station 3 (Applications -> Create -> paste this YAML).
# Guide: docs/INSTALL.md#qnap
#
# Before you start:
#   1. File Station: create /Container/mediamax with subfolders config, transcode and recordings.
#   2. PUID/PGID: SSH in and run `id <username>` (QNAP users usually start at uid 1000; group "everyone" = 100).
#   3. Change the /share/... paths below to your shared folders (keep the right-hand side as is).
services:
  mediamax:
    image: ghcr.io/bucifer6/mediamax:latest
    container_name: mediamax
    restart: unless-stopped
    ports:
      - "8484:8484"
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Europe/London
    volumes:
      - /share/Container/mediamax/config:/config
      - /share/Container/mediamax/transcode:/transcode
      - /share/Container/mediamax/recordings:/recordings
      - /share/Multimedia/Movies:/media/movies:ro
      - /share/Multimedia/TV:/media/tv:ro
      - /share/Multimedia/Music:/media/music:ro
    # Intel models with an iGPU (most Celeron/Pentium/Core QNAPs): hardware transcoding.
    # devices:
    #   - /dev/dri:/dev/dri
