# Kinora on OpenMediaVault 7 with the openmediavault-compose plugin
# (Services -> Compose -> Files -> Create, name "kinora", paste this file, Save, then Up).
# Guide: docs/INSTALL.md#openmediavault
#
# Before you start:
#   1. Storage -> Shared Folders: create "appdata" (or use the plugin's appdata folder) and your media folders.
#      Copy their absolute paths (they look like /srv/dev-disk-by-uuid-xxxx/media) into the volumes below.
#   2. PUID/PGID: the OMV user that owns your media. `id <username>` in a shell; usually 1000 / 100 (users).
services:
  kinora:
    image: ghcr.io/bucifer6/kinora:latest
    container_name: kinora
    restart: unless-stopped
    ports:
      - "8484:8484"
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Europe/London
    volumes:
      - /srv/dev-disk-by-uuid-CHANGE-ME/appdata/kinora/config:/config
      - /srv/dev-disk-by-uuid-CHANGE-ME/appdata/kinora/recordings:/recordings
      - /srv/dev-disk-by-uuid-CHANGE-ME/media/movies:/media/movies:ro
      - /srv/dev-disk-by-uuid-CHANGE-ME/media/tv:/media/tv:ro
      - /srv/dev-disk-by-uuid-CHANGE-ME/media/music:/media/music:ro
    tmpfs:
      - /transcode:size=2G
    # Intel/AMD hardware transcoding:
    # devices:
    #   - /dev/dri:/dev/dri
