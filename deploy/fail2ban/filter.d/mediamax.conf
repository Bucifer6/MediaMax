# fail2ban filter for the Kinora security log (<data>/logs/security.log, /config/logs/security.log in Docker).
#
# Matched lines (one per event, UTC ISO-8601 timestamps):
#   2026-11-20T15:25:14.875Z mediamax[security] AUTH_FAIL ip=198.51.100.7 user="admin" reason=password
#   2026-11-20T15:25:15.009Z mediamax[security] AUTH_FAIL ip=127.0.0.1 reason=api_key
#   2026-11-20T15:25:16.000Z mediamax[security] AUTH_LOCKED ip=203.0.113.9 account=u:admin
# AUTH_OK lines are never matched. reason is one of password, pin, totp, api_key, subsonic.
#
# Test it:
#   fail2ban-regex /opt/kinora/config/logs/security.log /etc/fail2ban/filter.d/mediamax.conf

[INCLUDES]
before = common.conf

[Definition]
# <ADDR> only matches IP addresses (never host names, so no DNS lookups). A dual-stack socket may report
# IPv4 clients as "::ffff:203.0.113.9"; the prefix is skipped so the plain IPv4 address gets banned.
_mm_ip = ip=(?:::ffff:(?=\d+\.))?<ADDR>(?=\s|$)

failregex = ^\s*mediamax\[security\] AUTH_FAIL %(_mm_ip)s
            ^\s*mediamax\[security\] AUTH_LOCKED %(_mm_ip)s

# Events without a client address can't be banned.
ignoreregex = mediamax\[security\] \S+ ip=unknown(?:\s|$)

# 2026-11-20T15:25:14.875Z : the trailing Z (%z) makes fail2ban read the time as UTC, whatever the host's zone.
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?%%z

# journald (`docker logs` via journald logging driver) works too:
#   journalmatch = CONTAINER_NAME=mediamax
