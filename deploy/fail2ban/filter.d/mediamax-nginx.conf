# fail2ban filter: 401/403/404 responses in the nginx access log (log_format mediamax_combined,
# deploy/nginx/mediamax-common.conf). 429 (rate limited) counts too.
# Artwork, avatars and trickplay thumbnails are ignored: a 404 there is a missing image, not an attack.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^<ADDR> - \S+ \[\] "[^"]*" (?:401|403|404|429)\s
ignoreregex = ^\S+ - \S+ \[\] "[A-Z]+ /api/v1/(?:items/[^/ ]+/images/|images/|users/[^/ ]+/avatar|trickplay/)

# [20/Nov/2026:15:25:14 +0000]
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
