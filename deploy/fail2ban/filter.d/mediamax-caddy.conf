# fail2ban filter: 401/403/404 responses in Caddy's JSON access log (deploy/caddy/Caddyfile).
# Uses client_ip, which is the visitor's address even behind Cloudflare when trusted_proxies is set.
# Artwork, avatars and trickplay thumbnails are ignored: a 404 there is a missing image, not an attack.

[Definition]
failregex = ^.*?"client_ip":"<ADDR>".*"status":(?:401|403|404)[,}]
ignoreregex = "uri":"/api/v1/(?:items/[^"/]+/images/|images/|users/[^"/]+/avatar|trickplay/)

# "ts":1795188654.9137838 (seconds since the epoch, UTC)
datepattern = "ts":{EPOCH}
