# Kinora on HTTPS with Let's Encrypt (certbot, webroot).
#
# Docker (deploy/install.sh): installed as /etc/nginx/templates/default.conf.template; the nginx image fills in
# ${MEDIAMAX_DOMAIN} at start. On a host nginx, replace ${MEDIAMAX_DOMAIN} with your name, copy
# mediamax-common.conf to conf.d/ (before this file) and the snippets/ folder to /etc/nginx/mediamax/.
# Needs nginx 1.25.1+ for "http2 on" (older: remove it and write "listen 443 ssl http2"). No "listen [::]" lines:
# Docker containers usually have IPv6 off, and Docker forwards IPv6 clients to them over IPv4. On a host nginx
# add "listen [::]:443 ssl;" (and [::]:80) next to the IPv4 lines.

# Port 80: Let's Encrypt challenges, everything else goes to HTTPS.
server {
    listen 80;
    server_name ${MEDIAMAX_DOMAIN};
    access_log /var/log/nginx/mediamax.access.log mediamax_combined;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${MEDIAMAX_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${MEDIAMAX_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${MEDIAMAX_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mediamax_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # One year. Add "; includeSubDomains; preload" only once every subdomain is on HTTPS for good.
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/mediamax.access.log mediamax_combined;

    include /etc/nginx/mediamax/mediamax-locations.conf;
}

# Anything that doesn't ask for ${MEDIAMAX_DOMAIN} (scanners hitting the bare IP) gets nothing.
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/mediamax.access.log mediamax_combined;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 444;
    }
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
