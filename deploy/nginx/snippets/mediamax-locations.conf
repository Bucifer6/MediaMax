# Kinora locations: include this inside a server {} block (HTTPS or HTTP).
#   include /etc/nginx/mediamax/mediamax-locations.conf;
# Needs the maps, zones and upstream from mediamax-common.conf in the http {} context.

# Uploads: 50 MB in Kinora plus multipart overhead. Backup restores (Admin → Backups) can be larger: see below.
client_max_body_size 64m;
# Stream uploads straight to Kinora and stream responses straight to the player.
proxy_request_buffering off;
proxy_buffering off;
proxy_http_version 1.1;
proxy_set_header Host $host;
# $remote_addr is the client (or the visitor's address after real_ip, see mediamax-common.conf). Replacing,
# not appending, means a client can't smuggle a fake address in its own X-Forwarded-For.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $mm_connection_upgrade;
proxy_hide_header X-Powered-By;
proxy_connect_timeout 10s;
# Long-lived responses: transcodes that take a while to produce the first segment, direct streams paused by
# the player, live TV MPEG-TS. These are idle timeouts, not total durations.
proxy_read_timeout 1h;
proxy_send_timeout 1h;
send_timeout 1h;

add_header X-Content-Type-Options $mm_nosniff always;
add_header Referrer-Policy $mm_referrer always;
add_header X-Frame-Options $mm_frame always;
add_header Content-Security-Policy $mm_csp always;

location / {
    proxy_pass http://mediamax_backend;
}

# WebSocket: kept open for a day of idling.
location = /api/v1/ws {
    proxy_pass http://mediamax_backend;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}

# Sign-in endpoints that check a secret (password, sign-in-screen PIN, profile-switch PIN, link code, 2FA).
location ~ ^/api/v1/auth/(?:login|profile-login|profiles/[^/]+/switch|link/approve|me/2fa/) {
    limit_req zone=mediamax_login burst=10 nodelay;
    proxy_pass http://mediamax_backend;
}

location /api/v1/auth/ {
    limit_req zone=mediamax_auth burst=40 nodelay;
    proxy_pass http://mediamax_backend;
}

# Restoring an uploaded backup: Kinora accepts up to 4 GB here.
location = /api/v1/admin/backups/restore-upload {
    client_max_body_size 4g;
    proxy_pass http://mediamax_backend;
}
