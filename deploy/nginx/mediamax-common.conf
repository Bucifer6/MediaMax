# Kinora: http-level settings shared by mediamax.conf (HTTPS) and mediamax-http.conf (no domain).
# Must be included once, in the http {} context, BEFORE the server blocks (the Docker setup installs it as
# conf.d/00-mediamax-common.conf). ${MEDIAMAX_UPSTREAM} is filled in by the nginx image from the environment
# (envsubst, limited to MEDIAMAX_* variables); on a host nginx write the address yourself, e.g. 127.0.0.1:8484.

server_tokens off;

# --- Upstream --------------------------------------------------------------------------------------------
# Docker's DNS (127.0.0.11) is asked again when Kinora is recreated with a new address ("resolve" needs
# nginx 1.27.3+; on an older host nginx drop "resolve", "zone" and the resolver line).
resolver 127.0.0.11 valid=10s ipv6=off;
upstream mediamax_backend {
    zone mediamax_backend 64k;
    server ${MEDIAMAX_UPSTREAM} resolve max_fails=0;
    keepalive 16;
}

# WebSocket upgrade (/api/v1/ws).
map $http_upgrade $mm_connection_upgrade {
    default upgrade;
    ''      '';
}

# --- Client address -------------------------------------------------------------------------------------
# nginx is the edge here: $remote_addr is the client. With Cloudflare (or another proxy) in front, uncomment
# so $remote_addr becomes the visitor's address, for Kinora, the rate limits, the logs and CrowdSec.
# Keep the list current: https://www.cloudflare.com/ips/
# set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22; set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;    set_real_ip_from 141.101.64.0/18; set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20; set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;  set_real_ip_from 162.158.0.0/15;  set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;   set_real_ip_from 131.0.72.0/22;
# set_real_ip_from 2400:cb00::/32;   set_real_ip_from 2606:4700::/32;  set_real_ip_from 2803:f800::/32;
# set_real_ip_from 2405:b500::/32;   set_real_ip_from 2405:8100::/32;  set_real_ip_from 2a06:98c0::/29;
# set_real_ip_from 2c0f:f248::/32;
# real_ip_header CF-Connecting-IP;
# Behind your own load balancer instead: set_real_ip_from <its address>; real_ip_header X-Forwarded-For; real_ip_recursive on;

# --- Rate limits ------------------------------------------------------------------------------------------
# Password, PIN, 2FA and device-link approval: 10 per minute per address, bursts of 10 (a family signing in on
# several TVs at once is fine; a password guesser is slowed to a crawl and also banned by fail2ban/CrowdSec).
limit_req_zone $binary_remote_addr zone=mediamax_login:10m rate=10r/m;
# Everything else under /api/v1/auth/ (/me, device-link polling from TV apps, sign-out...): generous.
limit_req_zone $binary_remote_addr zone=mediamax_auth:10m rate=5r/s;
limit_req_status 429;
limit_req_log_level warn;

# --- Security headers -------------------------------------------------------------------------------------
# Kinora sends X-Content-Type-Options, Referrer-Policy and X-Frame-Options itself, plus its own CSP on the
# sandboxed plugin pages (server/src/routes/plugins.ts) and uploaded images. These maps only fill in a header
# the server did not send (add_header skips empty values), so nothing is doubled or overridden.
map $upstream_http_x_content_type_options $mm_nosniff      { '' 'nosniff';               default ''; }
map $upstream_http_referrer_policy        $mm_referrer     { '' 'same-origin';           default ''; }
map $upstream_http_x_frame_options        $mm_frame        { '' 'SAMEORIGIN';            default ''; }
map $upstream_http_content_security_policy $mm_csp         { '' "frame-ancestors 'self'"; default ''; }

# --- Access log ------------------------------------------------------------------------------------------
# "combined" layout (CrowdSec's nginx parser and the fail2ban filter read it), with session tokens, API keys
# (api_key, OpenSubsonic apiKey), device-link poll tokens and Subsonic credentials in the query string replaced
# by REDACTED.
# Each pass redacts the first credential that is not redacted yet (one pass per possible key).
map $request $mm_req0a { '~^(?<a>.*?[?&](?:token|api_key|apiKey|pollToken)=)(?!REDACTED(?:[&\s]|$))[^&\s]*(?<b>.*)$' '${a}REDACTED${b}'; default $request; }
map $mm_req0a $mm_req0b { '~^(?<a>.*?[?&](?:token|api_key|apiKey|pollToken)=)(?!REDACTED(?:[&\s]|$))[^&\s]*(?<b>.*)$' '${a}REDACTED${b}'; default $mm_req0a; }
map $mm_req0b $mm_req1 { '~^(?<a>.*?[?&](?:token|api_key|apiKey|pollToken)=)(?!REDACTED(?:[&\s]|$))[^&\s]*(?<b>.*)$' '${a}REDACTED${b}'; default $mm_req0b; }
map $mm_req1 $mm_req2 { '~^(?<a>.*?[?&](?:token|api_key|apiKey|pollToken)=)(?!REDACTED(?:[&\s]|$))[^&\s]*(?<b>.*)$' '${a}REDACTED${b}'; default $mm_req1; }
map $mm_req2 $mm_req3 { '~^(?<a>.*?[?&]p=)[^&\s]*(?<b>.*)$'                 '${a}REDACTED${b}'; default $mm_req2; }
map $mm_req3 $mm_req4 { '~^(?<a>.*?[?&]t=)[^&\s]*(?<b>.*)$'                 '${a}REDACTED${b}'; default $mm_req3; }
map $mm_req4 $mm_request { '~^(?<a>.*?[?&]s=)[^&\s]*(?<b>.*)$'              '${a}REDACTED${b}'; default $mm_req4; }
log_format mediamax_combined '$remote_addr - $remote_user [$time_local] "$mm_request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

# --- Compression -------------------------------------------------------------------------------------------
# Text only. Video, audio, HLS playlists (application/vnd.apple.mpegurl) and segments, live TV MPEG-TS and
# Range (206) responses are never compressed.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

# Container health check (not reachable from outside).
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /nginx-health { return 200 "ok\n"; }
}
