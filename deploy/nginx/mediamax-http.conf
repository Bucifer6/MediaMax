# MediaMax over plain HTTP on port 8484, for installs without a domain name (http://<server-ip>:8484).
# Docker (deploy/install.sh): installed as /etc/nginx/templates/default.conf.template.
# Use HTTPS (mediamax.conf) as soon as MediaMax is reachable from the internet: passwords and session tokens
# travel in clear text over HTTP.

server {
    listen 8484 default_server;
    server_name _;

    access_log /var/log/nginx/mediamax.access.log mediamax_combined;

    include /etc/nginx/mediamax/mediamax-locations.conf;
}
