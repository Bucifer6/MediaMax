# CrowdSec scenarios for MediaMax sign-in abuse (needs parsers/s01-parse/mediamax-logs.yaml).
#
# 1. mediamax/mediamax-bf: more than 5 failed sign-ins (password, PIN, 2FA code, API key, Subsonic) or
#    lockouts from one address, leaking one per minute. Ban for the default profile duration (4h).
# 2. mediamax/mediamax-bf_user-enum: one address trying more than 5 different user names, i.e. guessing
#    accounts rather than mistyping a password.
type: leaky
name: mediamax/mediamax-bf
description: "Detect MediaMax sign-in brute force"
filter: "evt.Meta.log_type == 'mediamax_failed_auth'"
groupby: evt.Meta.source_ip
leakspeed: "1m"
capacity: 5
blackhole: 5m
labels:
  service: mediamax
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1110
  behavior: "http:bruteforce"
  label: "MediaMax sign-in brute force"
  remediation: true
---
type: leaky
name: mediamax/mediamax-bf_user-enum
description: "Detect MediaMax user name enumeration"
filter: "evt.Meta.log_type == 'mediamax_failed_auth' && evt.Meta.user != ''"
groupby: evt.Meta.source_ip
distinct: evt.Meta.user
leakspeed: "1m"
capacity: 5
blackhole: 5m
labels:
  service: mediamax
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1589
    - attack.T1110
  behavior: "http:bruteforce"
  label: "MediaMax user enumeration"
  remediation: true
