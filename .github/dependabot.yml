# Weekly dependency updates, grouped so they arrive as a few pull requests rather than dozens.
# Security fixes come as soon as GitHub publishes an advisory (Dependabot security updates, enabled in Settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/roku
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
