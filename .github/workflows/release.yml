name: Release

# Tag push (v1.2.3) -> standalone binaries for Windows x64 / Linux x64 / Linux arm64 with a bundled FFmpeg,
# smoke-tested on their own OS, attached to a GitHub Release; and a multi-arch Docker image on GHCR.
# Manual runs build and test everything; they publish only when "publish" is ticked.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub Release and push the Docker image
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          srv=$(sed -n "s/^ *version: '\(.*\)',$/\1/p" server/src/config.ts)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="$pkg"
            publish="${{ inputs.publish && 'true' || 'false' }}"
          fi
          # The server reports config.version, so a release must not ship a different number.
          if [[ "$version" != "$pkg" || "$version" != "$srv" ]]; then
            echo "::error::Version mismatch: release $version, package.json $pkg, server/src/config.ts $srv. Bump them together."
            exit 1
          fi
          [[ "$version" == *-* ]] && prerelease=true || prerelease=false
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version (prerelease: $prerelease, publish: $publish)"

  binaries:
    name: Binary (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Fetch static FFmpeg (pinned in scripts/ffmpeg.json, SHA-256 verified)
        run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }} --out build/ffmpeg
      - name: Build single executable and archive
        run: node scripts/package.mjs --target ${{ matrix.target }} --version ${{ env.VERSION }} --ffmpeg-dir build/ffmpeg
      - name: Build setup program (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          node scripts/build-installer.mjs --version $env:VERSION

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/smoke"; mkdir -p "$dir"
          tar -xzf "release/vibe-$VERSION-${{ matrix.target }}.tar.gz" -C "$dir"
          app="$dir/vibe-$VERSION-${{ matrix.target }}"
          file "$app/vibe" "$app/ffmpeg"
          "$app/ffmpeg" -hide_banner -version | head -1
          # No MEDIAMAX_DATA: must default to ~/.local/share/vibe and use the bundled ffmpeg.
          (cd / && MEDIAMAX_PORT=18484 "$app/vibe" > "$dir/server.log" 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18484/api/v1/system/info && break; sleep 1; done
          echo
          curl -sf http://127.0.0.1:18484/api/v1/system/info | grep -q '"setupRequired":true'
          curl -sf http://127.0.0.1:18484/api/v1/system/info | grep -q "\"version\":\"$VERSION\""
          curl -sf http://127.0.0.1:18484/ | grep -qi '<div id="root"'
          asset=$(curl -sf http://127.0.0.1:18484/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          curl -sf -o /dev/null "http://127.0.0.1:18484$asset"
          test -f "$HOME/.local/share/vibe/vibe.db"
          pkill -f "$app/vibe" || true
          cat "$dir/server.log"
          if grep -q 'ffmpeg was not found' "$dir/server.log"; then echo "::error::bundled ffmpeg not used"; exit 1; fi
          if grep -q 'ExperimentalWarning' "$dir/server.log"; then echo "::error::ExperimentalWarning not hidden"; exit 1; fi

      - name: Smoke test systemd unit (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/smoke/vibe-$VERSION-${{ matrix.target }}"
          sudo mkdir -p /opt/vibe && sudo cp -r "$app"/* /opt/vibe/
          sudo useradd --system --home-dir /var/lib/vibe --shell /usr/sbin/nologin vibe
          sudo cp /opt/vibe/vibe.service /etc/systemd/system/
          sudo systemd-analyze verify /etc/systemd/system/vibe.service
          sudo systemctl daemon-reload
          sudo systemctl start vibe
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8484/api/v1/system/info && break; sleep 1; done
          echo
          curl -sf http://127.0.0.1:8484/api/v1/system/info | grep -q setupRequired
          sudo test -f /var/lib/vibe/vibe.db
          test "$(sudo stat -c %U /var/lib/vibe/vibe.db)" = vibe
          sudo systemctl stop vibe
          sudo journalctl -u vibe --no-pager | tail -20

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'smoke'
          Expand-Archive "release/vibe-$env:VERSION-windows-x64.zip" -DestinationPath $dir
          Get-ChildItem $dir | Format-Table Name, Length
          foreach ($f in 'vibe.exe','ffmpeg.exe','ffprobe.exe','Vibe.cmd','install-service.ps1','update-vibe.ps1','README.txt','web\index.html') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f missing from the zip" }
          }
          & (Join-Path $dir 'ffmpeg.exe') -hide_banner -version | Select-Object -First 1
          # No MEDIAMAX_DATA: must default to %ProgramData%\Vibe and use the bundled ffmpeg.exe.
          $env:MEDIAMAX_PORT = '18484'
          $p = Start-Process -FilePath (Join-Path $dir 'vibe.exe') -WorkingDirectory $env:SystemRoot -PassThru `
            -RedirectStandardOutput "$dir\out.log" -RedirectStandardError "$dir\err.log"
          $info = $null
          for ($i = 0; $i -lt 30 -and -not $info; $i++) {
            try { $info = Invoke-RestMethod http://127.0.0.1:18484/api/v1/system/info } catch { Start-Sleep 1 }
          }
          if (-not $info) { Get-Content "$dir\out.log","$dir\err.log"; throw 'server did not start' }
          $info | ConvertTo-Json -Compress
          if ($info.setupRequired -ne $true) { throw 'setupRequired should be true' }
          if ($info.version -ne $env:VERSION) { throw "version $($info.version) != $env:VERSION" }
          $html = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18484/).Content
          if ($html -notmatch '<div id="root"') { throw 'web app not served' }
          $asset = [regex]::Match($html, '/assets/index-[^"]*\.js').Value
          Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:18484$asset" | Out-Null
          if (-not (Test-Path "$env:ProgramData\Vibe\vibe.db")) { throw 'database not created in %ProgramData%\Vibe' }
          Stop-Process -Id $p.Id -Force
          Start-Sleep 2
          $log = (Get-Content -Raw "$dir\out.log") + (Get-Content -Raw "$dir\err.log")
          $log
          if ($log -match 'ffmpeg was not found') { throw 'bundled ffmpeg.exe was not used' }
          if ($log -match 'ExperimentalWarning') { throw 'ExperimentalWarning should be hidden' }

      - name: Smoke test install-service.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'smoke'
          Remove-Item Env:\MEDIAMAX_PORT -ErrorAction SilentlyContinue
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\install-service.ps1"
          if ($LASTEXITCODE) { throw "install failed ($LASTEXITCODE)" }
          $task = Get-ScheduledTask -TaskName Vibe
          $task.Principal | Format-List UserId, LogonType, RunLevel
          if ($task.Principal.UserId -notmatch 'SYSTEM') { throw 'task should run as SYSTEM' }
          if (-not (Get-NetFirewallRule -DisplayName 'Vibe (HTTP 8484)')) { throw 'firewall rule missing' }
          $info = $null
          for ($i = 0; $i -lt 30 -and -not $info; $i++) {
            try { $info = Invoke-RestMethod http://127.0.0.1:8484/api/v1/system/info } catch { Start-Sleep 1 }
          }
          if (-not $info) { throw 'scheduled task did not start Vibe' }
          (Get-Process vibe).Path
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\install-service.ps1" -Uninstall
          if ($LASTEXITCODE) { throw "uninstall failed ($LASTEXITCODE)" }
          if (Get-ScheduledTask -TaskName Vibe -ErrorAction SilentlyContinue) { throw 'task still registered' }
          if (Get-NetFirewallRule -DisplayName 'Vibe (*' -ErrorAction SilentlyContinue) { throw 'firewall rules left behind' }
          if (Test-Path "$env:ProgramFiles\Vibe") { throw 'install folder left behind' }

          # Service as a Windows account (network shares that need a password): runs as it, keeps it on upgrade,
          # refuses a wrong password with exit code 2.
          # 14 characters at most: net user asks "longer than 14 characters, continue?" otherwise.
          $pw = 'Vb!7' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          net user vibesvc $pw /add
          if ($LASTEXITCODE) { throw 'could not create the test account' }
          net localgroup Administrators vibesvc /add
          if ($LASTEXITCODE) { throw 'could not make the test account an administrator' }
          $account = "$env:COMPUTERNAME\vibesvc"
          $pwFile = Join-Path $env:RUNNER_TEMP 'service-pw.txt'
          Set-Content -NoNewline -LiteralPath $pwFile -Value $pw
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\install-service.ps1" -User $account -PasswordFile $pwFile
          if ($LASTEXITCODE) { throw "install as $account failed ($LASTEXITCODE)" }
          if (Test-Path $pwFile) { throw 'password file left behind' }
          if ((Get-ScheduledTask -TaskName Vibe).Principal.UserId -notmatch 'vibesvc') { throw 'task should run as vibesvc' }
          $info = $null
          for ($i = 0; $i -lt 30 -and -not $info; $i++) {
            try { $info = Invoke-RestMethod http://127.0.0.1:8484/api/v1/system/info } catch { Start-Sleep 1 }
          }
          if (-not $info) { throw 'the task did not start Vibe as vibesvc' }
          $owner = (Get-Process vibe -IncludeUserName).UserName
          if ($owner -notmatch 'vibesvc') { throw "vibe.exe runs as $owner, not vibesvc" }
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\install-service.ps1"
          if ($LASTEXITCODE) { throw "upgrade failed ($LASTEXITCODE)" }
          if ((Get-ScheduledTask -TaskName Vibe).Principal.UserId -notmatch 'vibesvc') { throw 'an upgrade must keep the account' }
          Set-Content -NoNewline -LiteralPath $pwFile -Value 'not-the-password'
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\install-service.ps1" -User $account -PasswordFile $pwFile
          if ($LASTEXITCODE -ne 2) { throw "a wrong password should exit with 2, got $LASTEXITCODE" }
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\install-service.ps1" -Uninstall
          if ($LASTEXITCODE) { throw "uninstall failed ($LASTEXITCODE)" }
          net user vibesvc /delete | Out-Null

      - name: Smoke test setup program (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:\MEDIAMAX_PORT -ErrorAction SilentlyContinue
          $setup = (Resolve-Path "release/vibe-$env:VERSION-windows-x64-setup.exe").Path
          $app = Join-Path $env:ProgramFiles 'Vibe'
          $envKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          function Install([string[]]$extra, [string]$name) {
            $log = Join-Path $env:RUNNER_TEMP "setup-$name.log"
            # Not -Wait: that also waits for the tray app setup leaves running.
            $p = Start-Process $setup -ArgumentList (@('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"") + $extra) -PassThru
            if (-not $p.WaitForExit(300000)) { Get-Content $log | Select-Object -Last 40; throw "setup ($name) timed out" }
            if ($p.ExitCode) { Get-Content $log | Select-Object -Last 40; throw "setup ($name) exited with $($p.ExitCode)" }
          }
          function WaitUp([int]$port) {
            for ($i = 0; $i -lt 45; $i++) {
              try { return Invoke-RestMethod "http://127.0.0.1:$port/api/v1/system/info" } catch { Start-Sleep 1 }
            }
            throw "Vibe did not answer on port $port"
          }

          # 1. Fresh install, default "tray app" mode: the tray app starts the server as this user.
          Install @() 'tray'
          foreach ($f in 'vibe.exe', 'VibeTray.exe', 'ffmpeg.exe', 'web\index.html', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $app $f))) { throw "$f not installed" }
          }
          $info = WaitUp 8484
          if ($info.version -ne $env:VERSION) { throw "version $($info.version) != $env:VERSION" }
          if (-not (Get-Process VibeTray -ErrorAction SilentlyContinue)) { throw 'tray app not running' }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name Vibe -ErrorAction SilentlyContinue)) { throw 'sign-in start not set' }
          if (-not (Get-NetFirewallRule -DisplayName 'Vibe (HTTP 8484)' -ErrorAction SilentlyContinue)) { throw 'firewall rule missing' }
          if (Get-ScheduledTask -TaskName Vibe -ErrorAction SilentlyContinue) { throw 'tray mode must not register the task' }
          if (-not (Test-Path "$env:ProgramData\Vibe\vibe.db")) { throw 'database not created' }
          Set-Content "$env:RUNNER_TEMP\server-id.txt" $info.id

          # 2. Upgrade in place to "background service" mode on another port.
          Install @('/TASKS="service"', '/PORT=18486') 'service'
          Start-Sleep 3
          if (Get-Process VibeTray -ErrorAction SilentlyContinue) { throw 'tray app still running in service mode' }
          $task = Get-ScheduledTask -TaskName Vibe
          if ($task.Principal.UserId -notmatch 'SYSTEM') { throw 'task should run as SYSTEM' }
          WaitUp 18486 | Out-Null
          if ((Get-ItemProperty $envKey).VIBE_PORT -ne '18486') { throw 'port not stored' }
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\Vibe').ServiceMode -ne 1) { throw 'service mode not recorded' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name Vibe -ErrorAction SilentlyContinue) { throw 'sign-in start left on' }
          if (-not (Get-NetFirewallRule -DisplayName 'Vibe (HTTP 18486)' -ErrorAction SilentlyContinue)) { throw 'firewall rule missing' }

          # 3. Uninstall (silent: keeps the data). unins000.exe hands over to a temp copy, so wait for the folder to go.
          (Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru).WaitForExit(120000) | Out-Null
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $app 'vibe.exe')); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $app 'vibe.exe')) { throw 'program files left behind' }
          if (Get-ScheduledTask -TaskName Vibe -ErrorAction SilentlyContinue) { throw 'task still registered' }
          if (Get-NetFirewallRule -DisplayName 'Vibe (*' -ErrorAction SilentlyContinue) { throw 'firewall rules left behind' }
          if ((Get-ItemProperty $envKey).VIBE_PORT) { throw 'port variable left behind' }
          if (Get-Process vibe -ErrorAction SilentlyContinue) { throw 'vibe.exe still running' }
          if (-not (Test-Path "$env:ProgramData\Vibe\vibe.db")) { throw 'uninstall must keep the data' }
          if (Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '*6F1C3B52*' }) { throw 'Apps & features entry left behind' }

          # 4. Upgrade of an install made before the rename to Vibe: data in %ProgramData%\Kinora with mediamax.db (and
          #    its write-ahead log), SOFTWARE\Kinora, KINORA_PORT, a "Kinora" firewall rule and kinora.exe.
          $data = Join-Path $env:ProgramData 'Vibe'
          $legacy = Join-Path $env:ProgramData 'Kinora'
          $serverId = (Get-Content -Raw "$env:RUNNER_TEMP\server-id.txt" -ErrorAction SilentlyContinue)
          foreach ($x in '', '-wal', '-shm') { if (Test-Path "$data\vibe.db$x") { Rename-Item "$data\vibe.db$x" "mediamax.db$x" } }
          Set-Content "$data\legacy-marker.txt" 'kept'
          Rename-Item $data 'Kinora'
          New-Item -Force 'HKLM:\SOFTWARE\Kinora' | Out-Null
          New-ItemProperty -Force 'HKLM:\SOFTWARE\Kinora' -Name UpdateRepo -Value 'Bucifer6/MediaMax' | Out-Null
          New-ItemProperty -Force 'HKLM:\SOFTWARE\Kinora' -Name ServiceMode -PropertyType DWord -Value 0 | Out-Null
          [Environment]::SetEnvironmentVariable('KINORA_PORT', '18487', 'Machine')
          New-NetFirewallRule -DisplayName 'Kinora (HTTP 18487)' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 18487 | Out-Null
          New-Item -ItemType Directory -Force $app | Out-Null
          Set-Content (Join-Path $app 'kinora.exe') 'old'
          Install @() 'legacy'
          if (Test-Path $legacy) { throw '%ProgramData%\Kinora was not moved' }
          if (-not (Test-Path "$data\legacy-marker.txt")) { throw 'the data folder was not moved to %ProgramData%\Vibe' }
          $info = WaitUp 18487
          if ($serverId -and $info.id -ne $serverId.Trim()) { throw "server id changed: $($info.id) != $serverId" }
          if (-not (Test-Path "$data\vibe.db") -or (Test-Path "$data\mediamax.db")) { throw 'mediamax.db was not renamed to vibe.db' }
          if (Test-Path (Join-Path $app 'kinora.exe')) { throw 'kinora.exe left behind' }
          if (Test-Path 'HKLM:\SOFTWARE\Kinora') { throw 'SOFTWARE\Kinora left behind' }
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\Vibe').UpdateRepo -ne 'Bucifer6/MediaMax') { throw 'UpdateRepo not moved' }
          $machineEnv = Get-ItemProperty $envKey
          if ($machineEnv.KINORA_PORT -or $machineEnv.VIBE_PORT -ne '18487') { throw 'port not moved to VIBE_PORT' }
          if (Get-NetFirewallRule -DisplayName 'Kinora*' -ErrorAction SilentlyContinue) { throw 'old firewall rules left behind' }
          if (-not (Get-NetFirewallRule -DisplayName 'Vibe (HTTP 18487)' -ErrorAction SilentlyContinue)) { throw 'firewall rule missing' }
          (Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru).WaitForExit(120000) | Out-Null
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $app 'vibe.exe')); $i++) { Start-Sleep 1 }
          Write-Host 'Setup program: upgrade from the Kinora names passed.'
          Write-Host 'Setup program: install, upgrade to service and uninstall all passed.'

      - uses: actions/upload-artifact@v7
        with:
          name: vibe-${{ matrix.target }}
          path: release/vibe-*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [version, binaries, docker]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: vibe-*
          merge-multiple: true
      - name: Combined checksums
        working-directory: release
        run: |
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          # Manual runs: tag the commit that was built (GitHub would otherwise tag the default branch).
          target_commitish: ${{ github.sha }}
          name: Vibe ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ${{ startsWith(needs.version.outputs.version, '0.') && '> **Early preview (0.x).** The server and web app are tested end to end; the phone, TV and Roku apps have not yet been tested on real devices. Please report problems in Issues.' || '' }}

            ## Downloads
            | Platform | File |
            |---|---|
            | Windows 10/11, Server 2019+ (x64): **installer** (recommended) | `vibe-${{ needs.version.outputs.version }}-windows-x64-setup.exe` |
            | Windows 10/11, Server 2019+ (x64): portable zip | `vibe-${{ needs.version.outputs.version }}-windows-x64.zip` |
            | Linux x64 (glibc 2.28+) | `vibe-${{ needs.version.outputs.version }}-linux-x64.tar.gz` |
            | Linux arm64 (Raspberry Pi 4/5 64-bit, ARM servers) | `vibe-${{ needs.version.outputs.version }}-linux-arm64.tar.gz` |
            | Docker / NAS (amd64, arm64) | `docker pull ghcr.io/${{ github.repository_owner }}/vibe:${{ needs.version.outputs.version }}` (lower-case the owner; `…/kinora` is still published too) |

            Each download includes FFmpeg. The Windows installer runs Vibe as a tray app (starts when you sign in) or as a
            background service (starts with Windows), and adds Start menu shortcuts and an uninstaller. Install guides for Windows, Linux, Docker, Synology, QNAP, Unraid, TrueNAS SCALE
            and OpenMediaVault: [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/v${{ needs.version.outputs.version }}/docs/INSTALL.md).
            Verify downloads against `SHA256SUMS.txt`.
          files: |
            release/*.exe
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true

  docker:
    name: Docker image (amd64 + arm64)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Image name (GHCR needs a lower-case owner)
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/$owner/vibe" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      # Test the amd64 image before anything is pushed.
      - name: Build amd64 image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: vibe:release-test
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
      - name: Smoke test image (incl. PUID/PGID)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/config"
          docker run -d --name mm -p 8484:8484 -e PUID=1234 -e PGID=2345 -v "$RUNNER_TEMP/config:/config" vibe:release-test
          for i in $(seq 1 30); do curl -sf http://localhost:8484/api/v1/system/info && break; sleep 2; done
          echo
          curl -sf http://localhost:8484/api/v1/system/info | grep -q setupRequired
          curl -sf http://localhost:8484/ | grep -qi '<html'
          test "$(stat -c %u:%g "$RUNNER_TEMP/config/vibe.db")" = "1234:2345"
          test "$(docker exec mm sh -c 'stat -c %u /proc/1')" = "1234"
          docker exec mm ffmpeg -version | head -1
          docker logs mm | tail -20

      - name: Build arm64 image (emulated) for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: vibe:release-test-arm64
          cache-from: type=gha,scope=release
      - name: Smoke test arm64 image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --platform linux/arm64 --name mm-arm -p 8485:8484 vibe:release-test-arm64
          for i in $(seq 1 60); do curl -sf http://localhost:8485/api/v1/system/info && break; sleep 2; done
          echo
          curl -sf http://localhost:8485/api/v1/system/info | grep -q setupRequired
          docker exec mm-arm uname -m
          docker exec mm-arm ffmpeg -version | head -1

      - uses: docker/login-action@v4
        if: needs.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        if: needs.version.outputs.publish == 'true'
        shell: bash
        run: |
          # Also published under the former name "kinora", for anyone who pulled it before the rename.
          kinora="${IMAGE%/vibe}/kinora"
          tags="$IMAGE:$VERSION,$kinora:$VERSION"
          # Pre-releases (1.2.0-beta.1) never move "latest".
          if [[ "${{ needs.version.outputs.prerelease }}" != "true" ]]; then tags="$tags,$IMAGE:latest,$kinora:latest"; fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          echo "$tags"
      - name: Build and push multi-arch image
        if: needs.version.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.title=Vibe
            org.opencontainers.image.description=Self-hosted media server with IPTV, live TV, DVR and server-driven branding
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
