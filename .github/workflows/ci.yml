name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run build -w shared
      - run: npx tsc --noEmit -p server
      - run: npm test
      - run: npm run build -w server

  web:
    name: Web app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w shared
      - run: npm run build -w web

  mobile:
    name: Mobile/TV app typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Contract copy is in sync
        working-directory: .
        run: node scripts/sync-types.mjs && git diff --exit-code apps/mobile/src/api/types.ts
      - run: npm ci
      - run: npx tsc --noEmit

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mediamax:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name mm -p 8484:8484 mediamax:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8484/api/v1/system/info && break; sleep 2; done
          curl -sf http://localhost:8484/api/v1/system/info | grep -q setupRequired
          curl -sf http://localhost:8484/ | grep -qi "<html"
          docker exec mm ffmpeg -version | head -1
          docker logs mm | tail -20
      - name: Smoke test PUID/PGID
        run: |
          mkdir -p "$RUNNER_TEMP/config"
          docker run -d --name mm-puid -p 8485:8484 -e PUID=1234 -e PGID=2345 -v "$RUNNER_TEMP/config:/config" mediamax:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8485/api/v1/system/info && break; sleep 2; done
          test "$(stat -c %u:%g "$RUNNER_TEMP/config/mediamax.db")" = "1234:2345"
          test "$(docker exec mm-puid stat -c %u /proc/1)" = "1234"

  standalone:
    name: Standalone binary (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/package.mjs --target linux-x64
      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" && tar -xzf release/mediamax-*-linux-x64.tar.gz -C "$RUNNER_TEMP/smoke"
          app=$(echo "$RUNNER_TEMP"/smoke/mediamax-*-linux-x64)
          MEDIAMAX_DATA="$RUNNER_TEMP/data" "$app/mediamax" &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8484/api/v1/system/info && break; sleep 1; done
          curl -sf http://127.0.0.1:8484/api/v1/system/info | grep -q setupRequired
          curl -sf http://127.0.0.1:8484/ | grep -qi '<div id="root"'
          kill %1

  e2e:
    name: Browser smoke test (server + web)
    runs-on: ubuntu-latest
    # Official Playwright image: Chromium + its system libraries preinstalled (much faster than installing per run).
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.63.0
      - run: node scripts/e2e-smoke.cjs
