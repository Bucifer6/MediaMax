services:
  kinora:
    build: .
    image: kinora:latest                  # or use the published image: ghcr.io/bucifer6/kinora:latest
    container_name: kinora
    restart: unless-stopped
    ports:
      - "8484:8484"
    environment:
      - TZ=Europe/London
      # - PUID=1000                         # run as this user/group instead of root, so files written to
      # - PGID=1000                         #   /config and /recordings get your owner (set both)
      # - TMDB_API_KEY=your_tmdb_key        # or set it in Admin → Settings
      # - KINORA_HWACCEL=vaapi            # none | vaapi | qsv | nvenc | videotoolbox | v4l2m2m
    volumes:
      - ./config:/config                    # database, artwork cache, branding assets
      - ./recordings:/recordings            # DVR recordings
      - /path/to/movies:/media/movies:ro
      - /path/to/tv:/media/tv:ro
      - /path/to/music:/media/music:ro
    tmpfs:
      - /transcode:size=8G                  # fast RAM disk for HLS segments
    # Intel / AMD hardware transcoding:
    # devices:
    #   - /dev/dri:/dev/dri
    # Raspberry Pi 4 (V4L2 M2M) instead: the decoder and encoder nodes
    #   - /dev/video10:/dev/video10
    #   - /dev/video11:/dev/video11
    # NVIDIA hardware transcoding (NVIDIA Container Toolkit; compute = CUDA filters/OpenCL, video = NVENC/NVDEC,
    # utility = nvidia-smi for detection):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, compute, video, utility]
