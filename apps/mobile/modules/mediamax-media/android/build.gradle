plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'tv.mediamax.media'
version = '1.0.0'

android {
  namespace "tv.mediamax.media"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Media3's FFmpeg audio decoder (Jellyfin's prebuilt AAR, GPL-3.0; arm64-v8a, armeabi-v7a, x86, x86_64). expo-video
  // (patched, see patches/expo-video+*.patch) then decodes DTS / DTS-HD / TrueHD / MP2 … in software when MediaCodec
  // and HDMI passthrough can't, and MediaMaxMedia reports those codecs so the server stops transcoding them.
  // Keep the version on expo-video's Media3 minor (1.9.x). Build without it: VIBE_FFMPEG=0.
  if (System.getenv('VIBE_FFMPEG') != '0') {
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1'
  }
}
